name: Couvertures

on:
  push:
    branches: [main]
    paths: ["books.json", "mahe.json", "tools/fetch_covers.py", ".github/workflows/covers.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: covers
  cancel-in-progress: false

jobs:
  covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - name: Télécharger et enregistrer les couvertures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            python tools/fetch_covers.py
            git add -A covers
            if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
            git commit -m "Couvertures téléchargées automatiquement"
            if git push origin HEAD:main; then exit 0; fi
            echo "Le dépôt a bougé pendant le téléchargement, nouvel essai"
          done
          exit 1
