name: Couvertures

on:
  push:
    branches: [main]
    paths: ["books.json", "mahe.json", "tools/fetch_covers.py", ".github/workflows/covers.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: covers
  cancel-in-progress: false

jobs:
  covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - run: python tools/fetch_covers.py
      - name: Enregistrer les nouvelles couvertures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add covers
          if git diff --cached --quiet; then
            echo "Rien de nouveau"
          else
            git commit -m "Couvertures téléchargées automatiquement"
            git pull --rebase origin main
            git push
          fi
