<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La liste de Mahé</title>
<meta name="description" content="Les livres qui feraient plaisir à Mahé.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: a bookshop shelf — cover grid on a cool paper ground, detail opens as a sheet */
:root{
  --bg:#F2F3F6; --surface:#FFFFFF; --ink:#1A1D33; --muted:#5E6378; --line:#DADDE6;
  --sheet:#E7EAF3; --accent:#0E7C61; --accent-ink:#FFFFFF; --spine:#E4E7F0; --danger:#B3261E;
  --shadow:0 1px 2px rgba(26,29,51,.08),0 6px 18px rgba(26,29,51,.10);
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141F; --surface:#1B1E2D; --ink:#E9EAF2; --muted:#9A9FB5; --line:#2C3044;
  --sheet:#1D2030; --accent:#5FD3AE; --accent-ink:#12141F; --spine:#23273A; --danger:#F2867F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141F; --surface:#1B1E2D; --ink:#E9EAF2; --muted:#9A9FB5; --line:#2C3044;
  --sheet:#1D2030; --accent:#5FD3AE; --accent-ink:#12141F; --spine:#23273A; --danger:#F2867F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
h1{font:400 clamp(28px,6vw,40px)/1.1 var(--f-display);margin:0;text-wrap:balance}
.back{display:inline-block;color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;margin-bottom:8px}
.back:hover{color:var(--accent)}
.count{color:var(--muted);font-size:14px;margin-top:6px;font-variant-numeric:tabular-nums}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.book:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#q{flex:1 1 220px;min-width:0}
.tools .search{display:flex;flex:1 1 260px;min-width:0}
button{font:600 14px/1 var(--f-body);border-radius:8px;padding:10px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.danger{color:var(--danger);border-color:transparent;background:transparent;padding-inline:4px}

.shelves{display:flex;flex-direction:column;gap:34px}
.shelf{display:flex;flex-direction:column;gap:14px}
.shelf-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.shelf-head h2{font:400 clamp(19px,4vw,23px)/1.2 var(--f-display);margin:0;text-wrap:balance}
.shelf-head span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.tome{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.book.owned .cover{opacity:.5;filter:saturate(.6)}
.own{display:inline-block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:2px}
.done{color:var(--accent);font-weight:600}
details.home{border-top:1px dashed var(--line);padding-top:10px}
details.home summary{cursor:pointer;color:var(--muted);font-size:14px;font-weight:600;list-style:none;display:flex;align-items:center;gap:6px}
details.home summary::-webkit-details-marker{display:none}
details.home summary::before{content:"▸";transition:transform .15s}
details.home[open] summary::before{transform:rotate(90deg)}
details.home .grid{margin-top:14px}
.note{color:var(--muted);font-size:13px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:26px 18px}
@media (max-width:480px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 12px}}
.book{display:flex;flex-direction:column;gap:8px;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit;min-width:0;border-radius:6px}
.cover{aspect-ratio:2/3;width:100%;max-width:100%;border-radius:3px 6px 6px 3px;box-shadow:var(--shadow);overflow:hidden;background:var(--spine);position:relative;transition:transform .18s ease}
.book:hover .cover{transform:translateY(-3px)}
.cover img{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
.cover::after{z-index:2}
.cover::after{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:linear-gradient(90deg,rgba(0,0,0,.18),transparent)}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:12px 10px 12px 14px;background:var(--spine)}
.ph b{font:400 14px/1.2 var(--f-display);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.ph span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.meta b{display:block;font-weight:600;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta span{display:block;color:var(--muted);font-size:13px;line-height:1.3;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{border:1px dashed var(--line);border-radius:10px;padding:32px 20px;color:var(--muted);text-align:center}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(10,12,22,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:720px){.veil{align-items:center;padding:24px}}
.sheet{background:var(--sheet);width:100%;max-width:760px;max-height:72vh;max-height:72dvh;overflow:auto;overscroll-behavior:contain;border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(10,12,22,.25);
  padding:22px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
@media (min-width:720px){.sheet{border-radius:14px;padding:28px;max-height:86vh}}

.veil{animation:fade .18s ease}.sheet{animation:up .22s ease}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px)}}
@media (prefers-reduced-motion:reduce){.veil,.sheet{animation:none}}
.detail{display:grid;grid-template-columns:180px minmax(0,1fr);gap:24px}
@media (max-width:560px){.detail{grid-template-columns:110px minmax(0,1fr);gap:16px}.syn{grid-column:1/-1}}
.detail h2{font:400 clamp(22px,4.5vw,28px)/1.15 var(--f-display);margin:0 0 6px;text-wrap:balance}
.detail .by{color:var(--muted);margin:0 0 12px}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.facts li{font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-variant-numeric:tabular-nums}
.syn{grid-column:2;max-width:65ch}
.syn p{margin:0 0 .8em}
.syn .none{color:var(--muted);font-style:italic}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px}
.links{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-top:14px}
.links a{color:var(--accent);font-weight:600;font-size:14px}
form{display:grid;gap:12px}
form label{display:grid;gap:4px;font-size:13px;font-weight:600}
form .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
form textarea{min-height:130px;resize:vertical}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.notice{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.cover{transition:none}}
[hidden]{display:none!important}
img{max-width:100%}
.updated{color:var(--muted);font-size:12px;text-align:center}

/* --- transitions & chargement --- */
@view-transition{navigation:auto}
::view-transition-old(root){animation:vt-out .18s ease both}
::view-transition-new(root){animation:vt-in .26s ease both}
@keyframes vt-out{to{opacity:0;transform:translateY(-6px)}}
@keyframes vt-in{from{opacity:0;transform:translateY(8px)}}
.wrap{animation:page-in .35s ease both}
@keyframes page-in{from{opacity:0;transform:translateY(8px)}}
.cover:has(> img:not(.ok))::before{content:"";position:absolute;inset:0;z-index:2;background:var(--spine);animation:pulse 1.1s ease-in-out infinite alternate;will-change:opacity}
@keyframes pulse{from{opacity:1}to{opacity:.55}}
.cover img{opacity:0;transition:opacity .3s ease}
.cover{contain:paint}
.cover img.ok{opacity:1}
.book{animation:card-in .35s ease both;animation-delay:calc(var(--i,0) * 22ms)}
.grid .book:nth-child(n+13){animation:none}
.shelf{content-visibility:auto;contain-intrinsic-size:auto 640px}
@keyframes card-in{from{opacity:0;transform:translateY(10px)}}
.shelf{animation:page-in .35s ease both}
#grid.calm .book,#grid.calm .shelf{animation:none}
.veil.closing{animation:fade-out .18s ease both}.veil.closing .sheet{animation:down .2s ease both}
@keyframes fade-out{to{opacity:0}}@keyframes down{to{transform:translateY(60px);opacity:.6}}
h1{view-transition-name:title-mahe}
@media (prefers-reduced-motion:reduce){
  .wrap,.shelf,.book,.cover:has(> img:not(.ok))::before,.veil,.sheet,.veil.closing,.veil.closing .sheet{animation:none!important}
  .cover img{transition:none}
  ::view-transition-old(root),::view-transition-new(root){animation:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <a href="./" class="back">‹ Toutes les listes</a>
      <h1>La liste de Mahé</h1>
      <div class="count" id="count">Chargement de la liste…</div>
    </div>
  </header>
  <div class="tools">
    <div class="search"><input id="q" type="search" placeholder="Chercher un titre ou un auteur" aria-label="Chercher"></div>
    <select id="sort" aria-label="Affichage">
      <option value="series">Regroupés par saga</option>
      <option value="added">Ajoutés récemment</option>
      <option value="title">Titre (A–Z)</option>
      <option value="author">Auteur (A–Z)</option>
      <option value="year">Parution récente</option>
    </select>
  </div>
  <main class="shelves" id="grid" aria-live="polite"></main>
  <div class="empty" id="empty" hidden></div>
  <p class="updated"><a href="./" style="color:var(--accent)">Toutes les listes</a> · <a href="maxence.html" style="color:var(--accent)">La liste de Maxence</a></p>
</div>
<div class="veil" id="veil" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<script>
const $=s=>document.querySelector(s);
let books=[], openId=null;
const DATA="mahe.json", EMPTY_MSG="La liste de Mahé arrive bientôt : ses livres apparaîtront ici, avec couverture et résumé.";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const firstAuthorKey=a=>{const n=(a||"").split(",")[0].trim().split(" ");return (n[n.length-1]||"").toLowerCase()};
const fold=s=>(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const olCover=isbn=>isbn?`https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg?default=false`:"";
const gCover=id=>id?`https://books.google.com/books/content?id=${encodeURIComponent(id)}&printsec=frontcover&img=1&zoom=1`:"";
const found={};
const small=u=>u?u.replace(/fife=w\d+-h\d+/,"fife=w360-h540"):u;
function sources(b){
  if(b.noCover) return [];
  const o=olCover(b.isbn), g=b.cover?gCover(b.gid):"";
  return [...(b.covers||[]),small(b.cover),g,amzCover(b.isbn),o,lecCover(b.isbn),"api"].filter(Boolean);
}
function isbn10(i){
  if(!i||i.length!==13||!i.startsWith("978"))return "";
  const c=i.slice(3,12);let t=0;for(let k=0;k<9;k++)t+=(10-k)*+c[k];
  const d=(11-t%11)%11;return c+(d===10?"X":d);
}
const lecCover=i=>i?`https://media.e.leclerc/${i}_1?fit=fit&fmt=jpg&qlt=85&wid=450&hei=450`:"";
const amzCover=i=>{const t=isbn10(i);return t?`https://images-na.ssl-images-amazon.com/images/P/${t}.01.MZZZZZZZ.jpg`:""};
async function gbooks(q){
  try{
    const r=await fetch(`https://www.googleapis.com/books/v1/volumes?maxResults=10&q=${encodeURIComponent(q)}`);
    const d=await r.json();
    for(const it of d.items||[]){const l=it.volumeInfo&&it.volumeInfo.imageLinks;if(l&&(l.thumbnail||l.smallThumbnail))return (l.thumbnail||l.smallThumbnail).replace(/^http:/,"https:")}
  }catch(e){}
  return "";
}
let apiActive=0; const apiWait=[];
function apiSlot(){ return new Promise(r=>{ if(apiActive<3){apiActive++;r()} else apiWait.push(r) }) }
function apiDone(){ const n=apiWait.shift(); if(n) n(); else apiActive--; }
function cacheGet(k){ try{const v=localStorage.getItem("cv:"+k);return v?v:null}catch(e){return null} }
function cacheSet(k,v){ try{localStorage.setItem("cv:"+k,v)}catch(e){} }
async function olSearch(b){
  try{
    const r=await fetch(`https://openlibrary.org/search.json?limit=5&fields=cover_i&q=${encodeURIComponent((b.coverQuery||b.title))}`);
    const d=await r.json(); const it=(d.docs||[]).find(x=>x.cover_i);
    return it?`https://covers.openlibrary.org/b/id/${it.cover_i}-M.jpg`:"";
  }catch(e){return ""}
}
async function apiCover(b){
  const key=b.id, c=cacheGet(key); if(c!==null) return c;
  await apiSlot();
  try{
    const title=(b.title||"").split(/ [:\-–] /)[0].trim();
    const author=(b.authors||"").split(",")[0].trim().split(" ").pop();
    const url=(b.coverQuery&&await gbooks(b.coverQuery))||(b.isbn&&await gbooks(`isbn:${b.isbn}`))||await gbooks(`intitle:${title} inauthor:${author}`);
    const fin=url||await olSearch(b);
    if(fin) cacheSet(key,fin); return fin||"";
  } finally { apiDone(); }
}
async function nextCover(img){
  const b=books.find(x=>x.id===img.dataset.id); if(!b){img.remove();return}
  const list=sources(b); let i=+img.dataset.i+1;
  while(i<list.length){
    let src=list[i];
    if(src==="api") src=await apiCover(b);
    if(src){img.dataset.i=i;img.src=src;return}
    i++;
  }
  img.remove();
}
function coverOk(img){
  if(img.naturalWidth<10){nextCover(img);return}
  img.classList.add("ok");
  const b=books.find(x=>x.id===img.dataset.id); if(b) found[b.id]=img.src;
}
function coverHTML(b){
  const ph=`<div class="ph"><b>${esc(b.title)}</b><span>${esc((b.authors||"").split(",")[0])}</span></div>`;
  if(found[b.id]) return ph+`<img class="ok" src="${esc(found[b.id])}" alt="" decoding="async">`;
  const list=sources(b); if(!list.length) return ph;
  const first=list[0]==="api"?"data:image/gif;base64,R0lGODlhAQABAAAAACw=":list[0];
  return ph+`<img alt="" decoding="async" referrerpolicy="no-referrer" data-src="${esc(first)}" data-id="${esc(b.id)}" data-i="${list[0]==="api"?-1:0}" onload="coverOk(this)" onerror="nextCover(this)">`;
}
const io="IntersectionObserver" in window?new IntersectionObserver(es=>{for(const e of es){if(e.isIntersecting){io.unobserve(e.target);startImg(e.target)}}},{rootMargin:"400px 0px"}):null;
function startImg(img){ if(img.dataset.src&&!img.getAttribute("src")){ img.src=img.dataset.src; } }
function watchCovers(root,now){ for(const img of root.querySelectorAll("img[data-src]:not([src])")){ if(now||!io) startImg(img); else io.observe(img); } }
const coll=new Intl.Collator("fr",{numeric:true});
const tomeLabel=b=>b.series?(b.seriesNumber?`Tome ${b.seriesNumber}`:"Saga"):"";
function card(b,showSeries){
  const t=b.series&&b.seriesNumber?`<span class="tome">${showSeries?esc(b.series)+" · ":""}T${b.seriesNumber}</span>`:(showSeries&&b.series?`<span class="tome">${esc(b.series)}</span>`:"");
  const own=b.owned?`<span class="own">Déjà à la maison</span>`:"";
  return `<button class="book${b.owned?" owned":""}" data-id="${esc(b.id)}"><div class="cover">${coverHTML(b)}</div><div class="meta">${own||t}<b>${esc(b.title)}</b><span>${esc(b.authors)}</span></div></button>`;
}
function sortFlat(list,s){
  if(s==="title") list.sort((a,b)=>coll.compare(a.title,b.title));
  else if(s==="author") list.sort((a,b)=>coll.compare(firstAuthorKey(a.authors),firstAuthorKey(b.authors))||coll.compare(a.series||"",b.series||"")||(a.seriesNumber||0)-(b.seriesNumber||0)||coll.compare(a.title,b.title));
  else if(s==="year") list.sort((a,b)=>(b.year||"").localeCompare(a.year||"")||coll.compare(a.title,b.title));
  else list.sort((a,b)=>(b.addedAt||"").localeCompare(a.addedAt||"")||coll.compare(a.title,b.title));
  return list;
}
const fmtDate=d=>{try{return new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})}catch(e){return d}};
const bySeriesOrder=(a,b)=>(a.seriesNumber||999)-(b.seriesNumber||999)||(a.year||"").localeCompare(b.year||"")||coll.compare(a.title,b.title);
function render(){
  const q=fold($("#q").value.trim()), s=$("#sort").value, all=false;
  const match=b=>!q||fold(b.title+" "+b.authors+" "+(b.subtitle||"")+" "+(b.series||"")).includes(q);
  const hits=books.filter(match);
  const wished=hits.filter(b=>!b.owned);
  let html="";
  if(s==="series"){
    const groups={}, singles=[];
    for(const b of hits){ if(b.series)(groups[b.series]=groups[b.series]||[]).push(b); else if(all||!b.owned) singles.push(b); }
    const names=Object.keys(groups).sort((a,b)=>coll.compare(a,b));
    for(const n of names){
      const g=groups[n].sort(bySeriesOrder), want=g.filter(b=>!b.owned), have=g.filter(b=>b.owned);
      const meta=seriesMeta[n]||{};
      const authors=[...new Set(g.map(b=>b.authors))].join(" · ");
      const status=want.length?`${want.length} à offrir${have.length?` · ${have.length} déjà à la maison`:""}`:`<span class="done">Collection complète</span> · ${have.length} livre${have.length>1?"s":""} à la maison`;
      const checked=meta.checkedAt?` · liste vérifiée le ${fmtDate(meta.checkedAt)}`:"";
      const note=meta.note?`<p class="note">${esc(meta.note)}</p>`:(!want.length?`<p class="note">Mahé a tous les titres parus. Les nouveautés apparaîtront ici dès leur sortie.</p>`:"");
      let body="";
      if(all) body=`<div class="grid">${g.map(b=>card(b,false)).join("")}</div>`;
      else{
        if(want.length) body+=`<div class="grid">${want.map(b=>card(b,false)).join("")}</div>`;
        if(have.length) body+=`<details class="home"${want.length?"":""}><summary>Déjà à la maison (${have.length})</summary><div class="grid">${have.map(b=>card(b,false)).join("")}</div></details>`;
      }
      html+=`<section class="shelf"><div class="shelf-head"><h2>${esc(n)}</h2><span>${esc(authors)} · ${status}${checked}</span></div>${note}${body}</section>`;
    }
    if(singles.length){
      sortFlat(singles,"title");
      html+=`<section class="shelf">${names.length?`<div class="shelf-head"><h2>Autres livres</h2><span>${singles.length} livre${singles.length>1?"s":""}</span></div>`:""}<div class="grid">${singles.map(b=>card(b,true)).join("")}</div></section>`;
    }
  } else {
    const list=sortFlat((all?hits:wished).slice(),s);
    html=list.length?`<div class="grid">${list.map(b=>card(b,true)).join("")}</div>`:"";
  }
  if(io) io.disconnect();
  $("#grid").innerHTML=html;
  watchCovers($("#grid"),false);
  let k=0; for(const el of $("#grid").querySelectorAll(".book")){ el.style.setProperty("--i",Math.min(k++,12)); }
  const n=books.length, nw=books.filter(b=>!b.owned).length;
  $("#count").textContent=n?(q?`${wished.length} idée${wished.length>1?"s":""} sur ${nw} correspondent`:`${nw} idée${nw>1?"s":""} de cadeau`):"";
  const e=$("#empty"); e.hidden=!!html; if(!html) e.textContent=n?(q?"Aucun livre ne correspond à cette recherche.":"Rien à offrir pour l'instant : Mahé a déjà tout !"):EMPTY_MSG;
}
let seriesMeta={};
let seriesCount={};
$("#grid").addEventListener("click",e=>{const b=e.target.closest(".book");if(b)showDetail(b.dataset.id)});
$("#q").addEventListener("input",()=>{ $("#grid").classList.add("calm"); render(); });
$("#sort").addEventListener("change",()=>{ $("#grid").classList.remove("calm"); if(document.startViewTransition && !matchMedia("(prefers-reduced-motion: reduce)").matches) document.startViewTransition(render); else render();try{localStorage.setItem("view",$("#sort").value)}catch(e){}});
try{const s=localStorage.getItem("view");if(s)$("#sort").value=s}catch(e){}

function openSheet(html){$("#sheet").innerHTML=html;watchCovers($("#sheet"),true);$("#veil").hidden=false;document.body.style.overflow="hidden";$("#sheet").scrollTop=0}
function closeSheet(){
  const v=$("#veil"); if(v.hidden||v.classList.contains("closing")) return;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){ hideSheet(); return; }
  v.classList.add("closing"); setTimeout(()=>{ v.classList.remove("closing"); hideSheet(); },190);
}
function hideSheet(){$("#veil").hidden=true;document.body.style.overflow="";openId=null;if(location.hash)history.replaceState(null,"",location.pathname)}
$("#veil").addEventListener("click",e=>{if(e.target.id==="veil")closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#veil").hidden)closeSheet()});

function showDetail(id){
  const b=books.find(x=>x.id===id); if(!b) return; openId=id;
  history.replaceState(null,"","#"+id);
  const facts=[b.year&&`Parution ${b.year}`,b.pages&&`${b.pages} pages`,b.publisher].filter(Boolean);
  const about=(seriesMeta[b.series]||{}).about;
  const syn=(b.synopsis?b.synopsis.split(/\n+/).map(p=>`<p>${esc(p)}</p>`).join(""):"")+(about?`<p class="label" style="margin-top:14px">À propos de la série</p><p>${esc(about)}</p>`:"")||`<p class="none">Pas de résumé pour ce livre.</p>`;
  openSheet(`<div class="sheet-top"><span class="label">Fiche du livre</span><button id="close">Fermer</button></div>
  <div class="detail">
    <div class="cover">${coverHTML(b)}</div>
    <div>
      <h2>${esc(b.title)}</h2>
      ${b.subtitle?`<p class="by" style="margin-bottom:4px">${esc(b.subtitle)}</p>`:""}
      <p class="by">${esc(b.authors)}</p>
      ${b.owned?`<p class="by" style="margin-top:-6px"><span class="own">Déjà à la maison</span></p>`:""}
      ${b.series?`<p class="by" style="margin-top:-6px"><span class="tome">${esc(b.series)}${b.seriesNumber?" · tome "+b.seriesNumber:""}</span></p>`:""}
      ${facts.length?`<ul class="facts">${facts.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>`:""}
      <div class="links">
        ${b.isbn?`<span class="notice">ISBN ${esc(b.isbn)}</span>`:""}
        ${b.link?`<a href="${esc(b.link)}" target="_blank" rel="noopener">${b.link.includes("google")?"Voir sur Google Livres":b.link.includes("hachette-collections")?"Commander sur Hachette Collections":"Voir la fiche éditeur"}</a>`:""}
      </div>
    </div>
    <div class="syn">${b.synopsis?`<p class="label">Résumé</p>`:""}${syn}</div>
  </div>`);
  $("#close").onclick=closeSheet;
}

fetch(DATA,{cache:"no-cache"}).then(r=>r.json()).then(d=>{
  if(Array.isArray(d)){books=d;seriesMeta={}}else{books=d.books||[];seriesMeta=d.series||{}} seriesCount={}; for(const b of books) if(b.series) seriesCount[b.series]=(seriesCount[b.series]||0)+1; render();
  const h=location.hash.slice(1); if(h) showDetail(h);
}).catch(()=>{$("#count").textContent="";const e=$("#empty");e.hidden=false;e.textContent="La liste n'a pas pu être chargée. Rechargez la page."});
</script>
</body>
</html>
