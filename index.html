<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mes envies de lecture</title>
<meta name="description" content="Ma liste de souhaits de livres.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: a bookshop shelf — cover grid on a cool paper ground, detail opens as a sheet */
:root{
  --bg:#F2F3F6; --surface:#FFFFFF; --ink:#1A1D33; --muted:#5E6378; --line:#DADDE6;
  --accent:#2F45C8; --accent-ink:#FFFFFF; --spine:#E4E7F0; --danger:#B3261E;
  --shadow:0 1px 2px rgba(26,29,51,.08),0 6px 18px rgba(26,29,51,.10);
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141F; --surface:#1B1E2D; --ink:#E9EAF2; --muted:#9A9FB5; --line:#2C3044;
  --accent:#8C9CFF; --accent-ink:#12141F; --spine:#23273A; --danger:#F2867F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141F; --surface:#1B1E2D; --ink:#E9EAF2; --muted:#9A9FB5; --line:#2C3044;
  --accent:#8C9CFF; --accent-ink:#12141F; --spine:#23273A; --danger:#F2867F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
h1{font:400 clamp(28px,6vw,40px)/1.1 var(--f-display);margin:0;text-wrap:balance}
.count{color:var(--muted);font-size:14px;margin-top:6px;font-variant-numeric:tabular-nums}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.book:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#q{flex:1 1 220px;min-width:0}
.tools .search{display:flex;flex:1 1 260px;min-width:0}
button{font:600 14px/1 var(--f-body);border-radius:8px;padding:10px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.danger{color:var(--danger);border-color:transparent;background:transparent;padding-inline:4px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:26px 18px}
@media (max-width:480px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 12px}}
.book{display:flex;flex-direction:column;gap:8px;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit;min-width:0;border-radius:6px}
.cover{aspect-ratio:2/3;width:100%;max-width:100%;border-radius:3px 6px 6px 3px;box-shadow:var(--shadow);overflow:hidden;background:var(--spine);position:relative;transition:transform .18s ease}
.book:hover .cover{transform:translateY(-3px)}
.cover img{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
.cover::after{z-index:2}
.cover::after{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:linear-gradient(90deg,rgba(0,0,0,.18),transparent)}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:12px 10px 12px 14px;background:var(--spine)}
.ph b{font:400 14px/1.2 var(--f-display);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.ph span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.meta b{display:block;font-weight:600;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta span{display:block;color:var(--muted);font-size:13px;line-height:1.3;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{border:1px dashed var(--line);border-radius:10px;padding:32px 20px;color:var(--muted);text-align:center}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(10,12,22,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:720px){.veil{align-items:center;padding:24px}}
.sheet{background:var(--surface);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;
  padding:22px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
@media (min-width:720px){.sheet{border-radius:14px;padding:28px}}
.detail{display:grid;grid-template-columns:180px minmax(0,1fr);gap:24px}
@media (max-width:560px){.detail{grid-template-columns:110px minmax(0,1fr);gap:16px}.syn{grid-column:1/-1}}
.detail h2{font:400 clamp(22px,4.5vw,28px)/1.15 var(--f-display);margin:0 0 6px;text-wrap:balance}
.detail .by{color:var(--muted);margin:0 0 12px}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.facts li{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-variant-numeric:tabular-nums}
.syn{grid-column:2;max-width:65ch}
.syn p{margin:0 0 .8em}
.syn .none{color:var(--muted);font-style:italic}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px}
.links{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-top:14px}
.links a{color:var(--accent);font-weight:600;font-size:14px}
form{display:grid;gap:12px}
form label{display:grid;gap:4px;font-size:13px;font-weight:600}
form .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
form textarea{min-height:130px;resize:vertical}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.notice{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.cover{transition:none}}
[hidden]{display:none!important}
img{max-width:100%}
.updated{color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Mes envies de lecture</h1>
      <div class="count" id="count">Chargement de la liste…</div>
    </div>
  </header>
  <div class="tools">
    <div class="search"><input id="q" type="search" placeholder="Chercher un titre ou un auteur" aria-label="Chercher"></div>
    <select id="sort" aria-label="Trier">
      <option value="added">Ajoutés récemment</option>
      <option value="title">Titre (A–Z)</option>
      <option value="author">Auteur (A–Z)</option>
    </select>
  </div>
  <main class="grid" id="grid" aria-live="polite"></main>
  <div class="empty" id="empty" hidden></div>
</div>
<div class="veil" id="veil" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<script>
const $=s=>document.querySelector(s);
let books=[], openId=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const firstAuthorKey=a=>{const n=(a||"").split(",")[0].trim().split(" ");return (n[n.length-1]||"").toLowerCase()};
const fold=s=>(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const olCover=isbn=>isbn?`https://covers.openlibrary.org/b/isbn/${isbn}-L.jpg?default=false`:"";
const gCover=id=>id?`https://books.google.com/books/content?id=${encodeURIComponent(id)}&printsec=frontcover&img=1&zoom=1`:"";
const found={};
function sources(b){
  const o=olCover(b.isbn), g=b.cover?gCover(b.gid):"";
  return [b.cover,g,o,amzCover(b.isbn),"api"].filter(Boolean);
}
function isbn10(i){
  if(!i||i.length!==13||!i.startsWith("978"))return "";
  const c=i.slice(3,12);let t=0;for(let k=0;k<9;k++)t+=(10-k)*+c[k];
  const d=(11-t%11)%11;return c+(d===10?"X":d);
}
const amzCover=i=>{const t=isbn10(i);return t?`https://images-na.ssl-images-amazon.com/images/P/${t}.01.LZZZZZZZ.jpg`:""};
async function gbooks(q){
  try{
    const r=await fetch(`https://www.googleapis.com/books/v1/volumes?maxResults=10&q=${encodeURIComponent(q)}`);
    const d=await r.json();
    for(const it of d.items||[]){const l=it.volumeInfo&&it.volumeInfo.imageLinks;if(l&&(l.thumbnail||l.smallThumbnail))return (l.thumbnail||l.smallThumbnail).replace(/^http:/,"https:")}
  }catch(e){}
  return "";
}
async function apiCover(b){
  const title=(b.title||"").split(/ [:\-–] /)[0].trim();
  const author=(b.authors||"").split(",")[0].trim().split(" ").pop();
  return (b.isbn&&await gbooks(`isbn:${b.isbn}`))||await gbooks(`intitle:${title} inauthor:${author}`)||await gbooks(`${title} ${author}`);
}
async function nextCover(img){
  const b=books.find(x=>x.id===img.dataset.id); if(!b){img.remove();return}
  const list=sources(b); let i=+img.dataset.i+1;
  while(i<list.length){
    let src=list[i];
    if(src==="api") src=await apiCover(b);
    if(src){img.dataset.i=i;img.src=src;return}
    i++;
  }
  img.remove();
}
function coverOk(img){
  if(img.naturalWidth<10){nextCover(img);return}
  const b=books.find(x=>x.id===img.dataset.id); if(b) found[b.id]=img.src;
}
function coverHTML(b){
  const ph=`<div class="ph"><b>${esc(b.title)}</b><span>${esc((b.authors||"").split(",")[0])}</span></div>`;
  if(found[b.id]) return ph+`<img src="${esc(found[b.id])}" alt="">`;
  const list=sources(b); if(!list.length) return ph;
  if(list[0]==="api") return ph+`<img alt="" data-id="${esc(b.id)}" data-i="-1" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" onload="coverOk(this)" onerror="nextCover(this)">`;
  return ph+`<img src="${esc(list[0])}" alt="" loading="lazy" referrerpolicy="no-referrer" data-id="${esc(b.id)}" data-i="0" onload="coverOk(this)" onerror="nextCover(this)">`;
}
function render(){
  const q=fold($("#q").value.trim()); const s=$("#sort").value;
  let list=books.filter(b=>!q||fold(b.title+" "+b.authors+" "+(b.subtitle||"")).includes(q));
  const coll=new Intl.Collator("fr");
  if(s==="title") list.sort((a,b)=>coll.compare(a.title,b.title));
  else if(s==="author") list.sort((a,b)=>coll.compare(firstAuthorKey(a.authors),firstAuthorKey(b.authors))||coll.compare(a.title,b.title));
  else list.sort((a,b)=>(b.addedAt||"").localeCompare(a.addedAt||"")||coll.compare(a.title,b.title));
  $("#grid").innerHTML=list.map(b=>`<button class="book" data-id="${esc(b.id)}"><div class="cover">${coverHTML(b)}</div><div class="meta"><b>${esc(b.title)}</b><span>${esc(b.authors)}</span></div></button>`).join("");
  const n=books.length;
  $("#count").textContent=q?`${list.length} sur ${n} livres`:`${n} livres`;
  const e=$("#empty"); e.hidden=!!list.length; if(!list.length) e.textContent="Aucun livre ne correspond à cette recherche.";
}
$("#grid").addEventListener("click",e=>{const b=e.target.closest(".book");if(b)showDetail(b.dataset.id)});
$("#q").addEventListener("input",render);
$("#sort").addEventListener("change",()=>{render();try{localStorage.setItem("sort",$("#sort").value)}catch(e){}});
try{const s=localStorage.getItem("sort");if(s)$("#sort").value=s}catch(e){}

function openSheet(html){$("#sheet").innerHTML=html;$("#veil").hidden=false;document.body.style.overflow="hidden";$("#sheet").scrollTop=0}
function closeSheet(){$("#veil").hidden=true;document.body.style.overflow="";openId=null;if(location.hash)history.replaceState(null,"",location.pathname)}
$("#veil").addEventListener("click",e=>{if(e.target.id==="veil")closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#veil").hidden)closeSheet()});

function showDetail(id){
  const b=books.find(x=>x.id===id); if(!b) return; openId=id;
  history.replaceState(null,"","#"+id);
  const facts=[b.year&&`Parution ${b.year}`,b.pages&&`${b.pages} pages`,b.publisher].filter(Boolean);
  const syn=b.synopsis?b.synopsis.split(/\n+/).map(p=>`<p>${esc(p)}</p>`).join(""):`<p class="none">Pas de résumé pour ce livre.</p>`;
  openSheet(`<div class="sheet-top"><span class="label">Fiche du livre</span><button id="close">Fermer</button></div>
  <div class="detail">
    <div class="cover">${coverHTML(b)}</div>
    <div>
      <h2>${esc(b.title)}</h2>
      ${b.subtitle?`<p class="by" style="margin-bottom:4px">${esc(b.subtitle)}</p>`:""}
      <p class="by">${esc(b.authors)}</p>
      ${facts.length?`<ul class="facts">${facts.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>`:""}
      <div class="links">
        ${b.isbn?`<span class="notice">ISBN ${esc(b.isbn)}</span>`:""}
        ${b.link?`<a href="${esc(b.link)}" target="_blank" rel="noopener">Voir sur Google Livres</a>`:""}
      </div>
    </div>
    <div class="syn"><p class="label">Résumé</p>${syn}</div>
  </div>`);
  $("#close").onclick=closeSheet;
}

fetch("books.json",{cache:"no-cache"}).then(r=>r.json()).then(d=>{
  books=d; render();
  const h=location.hash.slice(1); if(h) showDetail(h);
}).catch(()=>{$("#count").textContent="";const e=$("#empty");e.hidden=false;e.textContent="La liste n'a pas pu être chargée. Rechargez la page."});
</script>
</body>
</html>
